services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spherex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spherex}
      POSTGRES_DB: ${POSTGRES_DB:-spherex}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spherex} -d ${POSTGRES_DB:-spherex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spherex}:${POSTGRES_PASSWORD:-spherex}@postgres:5432/${POSTGRES_DB:-spherex}
      REDIS_URL: redis://redis:6379/0
      CACHE_DIR: /data/cache
    ports:
      - "8000:8000"
    volumes:
      - cache_data:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  cache_data:
