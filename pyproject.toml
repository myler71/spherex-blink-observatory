[project]
name = "spherex-blink-observatory"
version = "0.1.0"
description = "SPHEREx Blink Observatory — Deterministic Astrophysics Engine, Archive Integrations, and Citation-Validated Cosmic Narrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "numpy>=2.1",
  "scipy>=1.14",
  "astropy>=7.0",
  "astroquery>=0.4.9",
  "pyvo>=1.6",
  "reproject>=0.14",
  "photutils>=2.0",
  "sep>=1.4",
  "httpx>=0.27",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.14",
  "sqlalchemy[asyncio]>=2.0",
  "greenlet>=3.1",
  "langgraph>=0.2.53",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: marks tests hitting external astronomical archives (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "backend"
